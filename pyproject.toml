[project]
name = "amplitrim"
version = "0.1.0"
description = "Recommends DADA2 truncLenF/truncLenR for paired-end amplicon reads by testing candidate settings on your own reads."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
figaro = ["scipy>=1.2"]      # only for the optional FIGARO cross-check

[project.scripts]
amplitrim = "amplitrim.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["amplitrim"]

[tool.setuptools.package-data]
amplitrim = ["_compat/*.py"]
