# Builds the JOSS paper draft as a PDF, to check that it compiles. Runs when the paper changes, or by hand; the PDF is an artifact of the run.
name: Paper draft
on:
  workflow_dispatch:
  push:
    paths:
      - "paper/**"
      - ".github/workflows/draft-pdf.yml"
jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper draft
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build the draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md
      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: paper/paper.pdf
